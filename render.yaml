services:

  - type: web
    name: arizona-civil
    runtime: node

    buildCommand: npm ci

    startCommand: npm start

    healthCheckPath: /health

    autoDeploy: true

    envVars:

      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: DATABASE_URL
        sync: false

      - key: SESSION_SECRET
        generateValue: true
